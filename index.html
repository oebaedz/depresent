<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dePresent - Sistem Presensi Kegiatan</title>
    <meta name="description" content="dePresent - Sistem presensi rapat dan kegiatan sekolah berbasis QR Code ID Card terintegrasi Supabase, notifikasi WhatsApp WAHA, mode proyektor, dan laporan resmi." />
    <meta property="og:title" content="dePresent - Sistem Presensi Kegiatan" />
    <meta property="og:description" content="dePresent - Sistem presensi rapat dan kegiatan sekolah berbasis QR Code ID Card terintegrasi Supabase, notifikasi WhatsApp WAHA, mode proyektor, dan laporan resmi." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            }
          });
        } catch (err) {
          console.warn('Polyfill fetch setter error:', err);
        }

        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            e.preventDefault();
            e.stopPropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (
            e.reason &&
            typeof e.reason.message === 'string' &&
            e.reason.message.indexOf('Cannot set property fetch') !== -1
          ) {
            e.preventDefault();
          }
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
